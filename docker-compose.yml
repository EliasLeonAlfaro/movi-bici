services:
  movibici:
    build: .
    image: movibici:0.9.0-rc1
    container_name: movibici
    env_file: .env
    ports:
      # Publicado solo en la interfaz local: la app es vulnerable por diseño y no debe exponerse a la red.
      - "0.0.0.0:4000:4000"
    volumes:
      - movibici-data:/app/data

volumes:
  movibici-data:
